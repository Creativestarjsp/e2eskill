name: E2E Runtime

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip pytest
      - run: python -m pytest -q
      - run: python -m e2e brain build
      - run: python -m e2e brain check
      - run: python -m e2e status
