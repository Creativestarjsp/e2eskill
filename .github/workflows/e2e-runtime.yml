name: E2E Runtime

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install E2E and test tooling
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build CodeBrain
        run: python -m e2e brain build
      - name: Check CodeBrain freshness
        run: python -m e2e brain check
      - name: Check guardrails
        run: python -m e2e guardrails check --stage verification
      - name: Run smoke evaluation suite
        run: python -m e2e eval-suite run evals/smoke.json
      - name: Check runtime status
        run: python -m e2e status
