name: E2E Real Agent Proof

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

jobs:
  proof:
    name: P0-P6 real-agent proof
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install E2E and test tooling
        run: python -m pip install -e . pytest
      - name: Verify Claude credentials
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo 'No Claude credential configured for real-agent proof.'
            exit 1
          fi
      - name: P0 tests
        run: pytest -q
      - name: Run complete P0-P6 proof campaign
        run: python -m e2e.proof_campaign
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real-agent-proof
          path: /tmp/e2e-real-proof
          if-no-files-found: warn
