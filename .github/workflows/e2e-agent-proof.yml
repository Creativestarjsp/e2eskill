name: E2E Real Agent Proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/e2e-agent-proof.yml
      - e2e/**
      - skills/**
      - standards/**
      - architecture/**
      - evals/**
  workflow_dispatch:

permissions:
  contents: read

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

jobs:
  proof:
    name: P0-P6 real-agent proof
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install E2E and test tooling
        run: python -m pip install -e . pytest

      - name: Verify Claude credentials are available
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "No Claude credential is configured for real-agent proof execution."
            exit 1
          fi

      - name: P0 tests
        run: pytest -q

      - name: P1 deterministic proof suite
        run: python -m e2e eval-suite run evals/proof.json

      - name: P2 orchestration proof
        run: |
          set -euo pipefail
          for task in \
            'Implement an API backend behavior change' \
            'Implement a Mongoose persistence change' \
            'Implement a frontend UI behavior change' \
            'Implement an authentication security change' \
            'Repair a regression without weakening tests'; do
            python -m e2e orchestrate "$task" > /tmp/plan.json
            python - <<'PY'
import json
plan = json.load(open('/tmp/plan.json'))
assert plan.get('workers'), plan
PY
          done

      - name: Start MongoDB for persistence proof
        run: |
          docker run -d --name e2e-proof-mongo -p 27017:27017 mongo:8.0
          for i in $(seq 1 30); do
            if docker exec e2e-proof-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; then exit 0; fi
            sleep 2
          done
          docker logs e2e-proof-mongo
          exit 1

      - name: P3/P4 real SD1 + independent SD3 task campaign
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/e2e-proof
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-proof-artifacts

          run_task() {
            family="$1"
            attempt="$2"
            task="$3"
            root="/tmp/e2e-proof-$family-$attempt"
            rm -rf "$root"
            git clone --no-local "$GITHUB_WORKSPACE" "$root"
            cd "$root"
            mkdir proof_fixture

            case "$family" in
              api-backend)
                cat > proof_fixture/service.py <<'PY'
def calculate_total(items):
    return sum(i["price"] * i["quantity"] for i in items)
PY
                cat > proof_fixture/test_service.py <<'PY'
from service import calculate_total

def test_total():
    assert calculate_total([{"price": 10, "quantity": 2}]) == 20
PY
                ;;
              database-mongoose)
                cat > proof_fixture/package.json <<'JSON'
{"name":"proof","private":true,"dependencies":{"mongoose":"^9.0.0"}}
JSON
                cat > proof_fixture/user.js <<'JS'
const mongoose = require('mongoose');
const S = new mongoose.Schema({email:{type:String,required:true,unique:true},displayName:{type:String,required:true}});
module.exports = mongoose.model('User', S);
JS
                cat > proof_fixture/test_user.js <<'JS'
const assert = require('node:assert/strict');
const mongoose = require('mongoose');
const User = require('./user');
const uri = process.env.MONGODB_URI;
(async () => {
  await mongoose.connect(uri);
  await User.init();
  await User.deleteMany({});
  assert.equal(User.schema.options.timestamps, true);
  assert.equal(User.schema.path('email').options.lowercase, true);
  const user = await User.create({email:'A@B.COM',displayName:'A'});
  assert.equal(user.email, 'a@b.com');
  const found = await User.findOne({email:'a@b.com'}).lean();
  assert.equal(found.displayName, 'A');
  await assert.rejects(() => User.create({email:'a@b.com',displayName:'Duplicate'}));
  await User.deleteOne({_id:user._id});
  assert.equal(await User.countDocuments(), 0);
  await mongoose.disconnect();
})().catch(async err => { console.error(err); try { await mongoose.disconnect(); } catch {} process.exit(1); });
JS
                (cd proof_fixture && npm install --no-audit --no-fund)
                ;;
              frontend-ui)
                cat > proof_fixture/package.json <<'JSON'
{"name":"proof","private":true,"dependencies":{"playwright":"^1.55.0"}}
JSON
                cat > proof_fixture/index.html <<'HTML'
<!doctype html><html><body><button id="increment" type="button">Count: <span id="count">0</span></button></body></html>
HTML
                cat > proof_fixture/test_ui.js <<'JS'
const assert = require('node:assert/strict');
const { chromium } = require('playwright');
(async () => {
  const browser = await chromium.launch({headless:true});
  const page = await browser.newPage();
  await page.goto('file://' + require('node:path').resolve('index.html'));
  await page.getByRole('button', {name:/Count: 0/}).click();
  await page.getByText('Count: 1').waitFor();
  assert.equal(await page.locator('#count').textContent(), '1');
  await page.screenshot({path:'proof-ui.png'});
  await browser.close();
})().catch(err => { console.error(err); process.exit(1); });
JS
                (cd proof_fixture && npm install --no-audit --no-fund && npx playwright install --with-deps chromium)
                ;;
              authentication-security)
                cat > proof_fixture/auth.py <<'PY'
import hashlib

def fingerprint(token):
    return hashlib.sha256(token.encode()).hexdigest()
PY
                cat > proof_fixture/test_auth.py <<'PY'
from auth import fingerprint

def test_secret_not_returned():
    assert fingerprint("secret") != "secret"
PY
                ;;
              regression-repair)
                cat > proof_fixture/cart.py <<'PY'
def subtotal(items):
    return sum(i["price"] + i["quantity"] for i in items)
PY
                cat > proof_fixture/test_cart.py <<'PY'
from cart import subtotal

def test_regression():
    assert subtotal([{"price":10,"quantity":2},{"price":5,"quantity":1}]) == 25
PY
                ;;
            esac

            python -m e2e execute "$task Run all fixture tests. Changes must stay in proof_fixture. Do not modify the E2E harness or weaken, delete, skip, or rewrite required tests." --runtime claude-code --execute --max-workers 2 > ".proof-$family-$attempt.json"
            python - <<'PY'
import json
from pathlib import Path
p = Path.cwd()
run = json.loads((p / '.proof-' + Path('.').name).read_text()) if False else None
PY
            report=".proof-$family-$attempt.json"
            python - "$report" <<'PY'
import json, sys
r=json.load(open(sys.argv[1]))
assert r.get('status') == 'approved', r
assert r.get('supervisor', {}).get('report', {}).get('decision') == 'approved', r
PY

            review_task='Independently verify the completed execution task and its evidence. Inspect the actual changed files, tests, runtime result, and integration evidence. Do not mutate the repository.'
            python - "$review_task" ".proof-$family-$attempt.json" <<'PY'
import json, sys
from e2e.supervisor import run_independent_review
result = run_independent_review('.', sys.argv[1], 'claude-code', sys.argv[2])
json.dump(result, open('independent-sd3.json','w'), indent=2)
assert result.get('mode') == 'independent-read-only', result
assert result.get('report', {}).get('decision') == 'approved', result
PY

            if [ "$family" = database-mongoose ]; then
              MONGODB_URI="$MONGODB_URI" node proof_fixture/test_user.js
            elif [ "$family" = frontend-ui ]; then
              node proof_fixture/test_ui.js
            else
              python -m pytest proof_fixture -q
            fi
            git diff --check

            mkdir -p /tmp/e2e-proof-artifacts/$family-$attempt
            cp ".proof-$family-$attempt.json" /tmp/e2e-proof-artifacts/$family-$attempt/execution.json
            cp independent-sd3.json /tmp/e2e-proof-artifacts/$family-$attempt/independent-sd3.json
            cp -R proof_fixture /tmp/e2e-proof-artifacts/$family-$attempt/
          }

          run_task api-backend 1 'Implement discount-aware calculate_total and focused tests.'
          run_task api-backend 2 'Implement discount-aware calculate_total and focused tests.'
          run_task database-mongoose 1 'Improve the Mongoose model with production-quality validation/options, real MongoDB CRUD, duplicate protection, and focused integration tests. Use the provided MONGODB_URI; do not replace MongoDB with mocks or in-memory emulators.'
          run_task database-mongoose 2 'Improve the Mongoose model with production-quality validation/options, real MongoDB CRUD, duplicate protection, and focused integration tests. Use the provided MONGODB_URI; do not replace MongoDB with mocks or in-memory emulators.'
          run_task frontend-ui 1 'Implement interactive count increment behavior. This proof requires a real Playwright browser click and rendered-state verification plus screenshot; do not replace browser verification with static inspection.'
          run_task frontend-ui 2 'Implement interactive count increment behavior. This proof requires a real Playwright browser click and rendered-state verification plus screenshot; do not replace browser verification with static inspection.'
          run_task authentication-security 1 'Harden the authentication helper with safe token verification and wrong-token security tests.'
          run_task authentication-security 2 'Harden the authentication helper with safe token verification and wrong-token security tests.'
          run_task regression-repair 1 'Diagnose and repair the intentional subtotal regression without weakening tests.'
          run_task regression-repair 2 'Diagnose and repair the intentional subtotal regression without weakening tests.'

      - name: P5 recovery campaign
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-recovery-artifacts

          recover() {
            scenario="$1"
            root="/tmp/e2e-recovery-$scenario"
            rm -rf "$root"
            git clone --no-local "$GITHUB_WORKSPACE" "$root"
            cd "$root"
            mkdir recovery_fixture
            case "$scenario" in
              test-failure)
                printf '%s\n' 'def add(a,b): return a-b' > recovery_fixture/calculator.py
                printf '%s\n' 'from calculator import add' 'def test_add(): assert add(2,3)==5' > recovery_fixture/test_calculator.py
                ;;
              integration-failure)
                printf '%s\n' 'def create_user(name): return {"name":name}' > recovery_fixture/provider.py
                printf '%s\n' 'from provider import create_user' 'def consume_user(): return create_user("proof")["display_name"]' > recovery_fixture/consumer.py
                printf '%s\n' 'from consumer import consume_user' 'def test_contract(): assert consume_user()=="proof"' > recovery_fixture/test_contract.py
                ;;
              verification-failure)
                printf '%s\n' 'import hashlib' 'def password_digest(password): return hashlib.sha256(password.encode()).hexdigest()' > recovery_fixture/security.py
                printf '%s\n' 'from security import password_digest' 'def test_security(): assert password_digest("secret")!="secret"' > recovery_fixture/test_security.py
                printf '%s\n' 'from security import verify_password' 'assert verify_password("secret", password_digest("secret")) is True' > recovery_fixture/verify.py
                ;;
            esac

            set +e
            if [ "$scenario" = verification-failure ]; then python recovery_fixture/verify.py > pre.txt 2>&1; else python -m pytest recovery_fixture -q > pre.txt 2>&1; fi
            code=$?
            set -e
            test "$code" -ne 0

            task="Recover from the distinct $scenario failure in recovery_fixture. Diagnose the root cause, repair it without weakening/deleting tests, run relevant tests, and leave the fixture verified. Do not modify the E2E harness."
            if [ "$scenario" = verification-failure ]; then
              task="$task Add verify_password to recovery_fixture/security.py using constant-time digest comparison; do not modify verify.py or its test."
            fi
            python -m e2e execute "$task" --runtime claude-code --execute --max-workers 2 > "recovery-$scenario.json"
            if [ "$scenario" = verification-failure ]; then
              python -m pytest recovery_fixture -q
              python -c 'from recovery_fixture.security import password_digest,verify_password; assert verify_password("secret",password_digest("secret"))'
            else
              python -m pytest recovery_fixture -q
            fi

            python - "recovery-$scenario.json" <<'PY'
import json, sys
r=json.load(open(sys.argv[1]))
assert r.get('status') == 'approved', r
assert r.get('supervisor', {}).get('report', {}).get('decision') == 'approved', r
PY
            python - "recovery-$scenario.json" <<'PY'
import json, sys
from e2e.supervisor import run_independent_review
r=run_independent_review('.', 'Independently verify recovery of this completed failure. Inspect root cause, repair, tests and evidence; do not mutate.', 'claude-code', sys.argv[1])
json.dump(r, open('independent-sd3.json','w'), indent=2)
assert r.get('mode') == 'independent-read-only', r
assert r.get('report', {}).get('decision') == 'approved', r
PY

            mkdir -p /tmp/e2e-recovery-artifacts/$scenario
            cp pre.txt recovery-$scenario.json independent-sd3.json /tmp/e2e-recovery-artifacts/$scenario/
            cp -R recovery_fixture /tmp/e2e-recovery-artifacts/$scenario/
          }

          recover test-failure
          recover integration-failure
          recover verification-failure

      - name: P6 repeated-evidence gate
        run: |
          set -euo pipefail
          python - <<'PY'
import json
from pathlib import Path
root=Path('/tmp/e2e-proof-artifacts')
runs=sorted(root.glob('*/execution.json'))
independent=sorted(root.glob('*/independent-sd3.json'))
recovery=sorted(Path('/tmp/e2e-recovery-artifacts').glob('*/recovery-*.json'))
recovery_independent=sorted(Path('/tmp/e2e-recovery-artifacts').glob('*/independent-sd3.json'))
assert len(runs) == 10, len(runs)
assert len(independent) == 10, len(independent)
assert len(recovery) == 3, len(recovery)
assert len(recovery_independent) == 3, len(recovery_independent)
for path in runs + recovery:
    data=json.load(path.open())
    assert data.get('status') == 'approved', path
    assert data.get('supervisor', {}).get('report', {}).get('decision') == 'approved', path
for path in independent + recovery_independent:
    data=json.load(path.open())
    assert data.get('mode') == 'independent-read-only', path
    assert data.get('report', {}).get('decision') == 'approved', path
result={
  'status':'PROVEN',
  'p0_p2':'passed',
  'p3_p4_attempts':len(runs),
  'p5_recovery':len(recovery),
  'p6_pass_rate':1.0,
  'independent_sd3_reviews':len(independent)+len(recovery_independent),
  'anti_cheating':'required tests preserved'
}
Path('/tmp/PROVEN.json').write_text(json.dumps(result, indent=2))
print(json.dumps(result, indent=2))
PY

      - name: Upload complete proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real-agent-proof
          path: |
            /tmp/e2e-proof-artifacts
            /tmp/e2e-recovery-artifacts
            /tmp/PROVEN.json
          if-no-files-found: warn

      - name: Stop MongoDB
        if: always()
        run: docker rm -f e2e-proof-mongo || true
