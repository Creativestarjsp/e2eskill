name: E2E Real Agent Proof

# Cost-bearing proof campaign. Real SD1/SD3 agents work only in disposable
# repositories. No proof job can push agent changes back to main.
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Independent attempts per task family'
        required: true
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  task-proof:
    name: P3-P4 • ${{ matrix.family }} • attempt ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [api-backend, database-mongoose, frontend-ui, authentication-security, regression-repair]
        attempt: [1, 2]
    env:
      E2E_AGENT_TIMEOUT: '1200'
    steps:
      - name: Checkout E2E
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install E2E
        run: python -m pip install -e . pytest

      - name: Prepare Claude Code runtime
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            Do not modify repository files. Verify the Claude Code runtime is
            available for this E2E proof job, then respond READY.

      - name: Create disposable proof repository
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          rm -rf /tmp/e2e-proof
          git clone --no-local "$GITHUB_WORKSPACE" /tmp/e2e-proof
          cd /tmp/e2e-proof
          git config user.name "E2E Proof"
          git config user.email "e2e-proof@localhost"
          rm -rf proof_fixture
          mkdir -p proof_fixture
          case "$FAMILY" in
            api-backend)
              cat > proof_fixture/service.py <<'PY'
          def calculate_total(items):
              return sum(item["price"] * item["quantity"] for item in items)
          PY
              cat > proof_fixture/test_service.py <<'PY'
          from service import calculate_total

          def test_total_empty():
              assert calculate_total([]) == 0

          def test_total_multiple_items():
              assert calculate_total([{"price": 10, "quantity": 2}, {"price": 5, "quantity": 3}]) == 35
          PY
              ;;
            database-mongoose)
              cat > proof_fixture/package.json <<'JSON'
          {"name":"e2e-mongoose-proof","private":true,"dependencies":{"mongoose":"^9.0.0"}}
          JSON
              cat > proof_fixture/user.js <<'JS'
          const mongoose = require('mongoose');
          const UserSchema = new mongoose.Schema({
            email: { type: String, required: true, unique: true },
            displayName: { type: String, required: true }
          });
          module.exports = mongoose.model('User', UserSchema);
          JS
              cat > proof_fixture/test_user.js <<'JS'
          const assert = require('node:assert/strict');
          const User = require('./user');
          const user = new User({ email: 'proof@example.com', displayName: 'Proof' });
          assert.equal(user.validateSync(), undefined);
          assert.throws(() => new User({ displayName: 'Missing email' }).validateSync());
          console.log('mongoose schema proof passed');
          JS
              ;;
            frontend-ui)
              cat > proof_fixture/index.html <<'HTML'
          <!doctype html>
          <html><body><main><button id="increment" type="button">Count: <span id="count">0</span></button></main></body></html>
          HTML
              cat > proof_fixture/test_ui.py <<'PY'
          from pathlib import Path

          def test_ui_has_accessible_button_and_count():
              html = Path(__file__).with_name("index.html").read_text()
              assert 'id="increment"' in html
              assert 'id="count"' in html
              assert 'type="button"' in html
          PY
              ;;
            authentication-security)
              cat > proof_fixture/auth.py <<'PY'
          import hashlib

          def fingerprint(token: str) -> str:
              return hashlib.sha256(token.encode()).hexdigest()
          PY
              cat > proof_fixture/test_auth.py <<'PY'
          from auth import fingerprint

          def test_fingerprint_is_deterministic_without_exposing_secret():
              token = "proof-secret"
              result = fingerprint(token)
              assert result != token
              assert len(result) == 64
              assert fingerprint(token) == result
          PY
              ;;
            regression-repair)
              cat > proof_fixture/cart.py <<'PY'
          def subtotal(items):
              return sum(item["price"] * item["quantity"] for item in items)
          PY
              cat > proof_fixture/test_cart.py <<'PY'
          from cart import subtotal

          def test_subtotal_regression():
              assert subtotal([{"price": 10, "quantity": 2}, {"price": 5, "quantity": 1}]) == 25
          PY
              # Introduce a real regression after the baseline has been created.
              sed -i 's/item\["price"\] \* item\["quantity"\]/item["price"] + item["quantity"]/' proof_fixture/cart.py
              ;;
          esac

      - name: Install family dependencies
        if: matrix.family == 'database-mongoose'
        working-directory: /tmp/e2e-proof/proof_fixture
        run: npm install --no-audit --no-fund

      - name: Run real SD1 implementation + SD3 verification
        working-directory: /tmp/e2e-proof
        env:
          FAMILY: ${{ matrix.family }}
          ATTEMPT: ${{ matrix.attempt }}
        run: |
          set -euo pipefail
          case "$FAMILY" in
            api-backend) TASK='Implement a production-quality discount-aware calculate_total(items) API-domain helper in proof_fixture/service.py. Preserve existing behavior, add focused tests for normal, empty, and discount cases, run the fixture tests, and have SD3 independently verify correctness, scope, and evidence.' ;;
            database-mongoose) TASK='Improve proof_fixture/user.js as a production-quality Mongoose persistence model. Add explicit validation and safe schema options, add focused Node tests for valid and invalid documents, run the tests, and have SD3 independently verify the Mongoose design, validation, indexes/options, and evidence. Do not require a live MongoDB server.' ;;
            frontend-ui) TASK='Implement the missing interactive behavior in proof_fixture/index.html so clicking the button increments the displayed count. Add focused tests or an executable browser-independent verification where appropriate, run all fixture tests, and have SD3 independently verify accessibility, behavior, minimality, and evidence.' ;;
            authentication-security) TASK='Harden proof_fixture/auth.py as a minimal authentication security helper. Add a safe token-verification primitive that never returns or logs the secret, add focused security tests including wrong-token behavior, run all fixture tests, and have SD3 independently verify the security properties and evidence.' ;;
            regression-repair) TASK='Diagnose and repair the intentionally introduced regression in proof_fixture/cart.py. Do not weaken or delete the existing failing test. Add a focused regression test if useful, run the complete fixture tests, and have SD3 independently verify the root cause, repair, and evidence.' ;;
          esac
          python -m e2e execute "$TASK Do not change the E2E proof harness, do not skip tests, do not weaken assertions, and keep changes limited to proof_fixture." --runtime claude-code --execute --max-workers 2 | tee ".e2e-proof-${FAMILY}-${ATTEMPT}.json"

      - name: Execute family tests
        working-directory: /tmp/e2e-proof
        run: |
          set -euo pipefail
          if [ '${{ matrix.family }}' = 'database-mongoose' ]; then
            node proof_fixture/test_user.js
          else
            python -m pytest proof_fixture -q
          fi
          git diff --check
          test -n "$(grep -R -E 'def |function |<button|Schema' proof_fixture 2>/dev/null || true)"

      - name: Capture proof evidence
        if: always()
        env:
          FAMILY: ${{ matrix.family }}
          ATTEMPT: ${{ matrix.attempt }}
        run: |
          cd /tmp/e2e-proof
          mkdir -p proof-evidence
          cp ".e2e-proof-${FAMILY}-${ATTEMPT}.json" proof-evidence/agent-result.json 2>/dev/null || true
          cp -a .e2e proof-evidence/e2e 2>/dev/null || true
          cp -a proof_fixture proof-evidence/proof_fixture 2>/dev/null || true
          git status --short > proof-evidence/git-status.txt
          git diff -- proof_fixture > proof-evidence/proof.diff || true

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-proof-${{ matrix.family }}-${{ matrix.attempt }}
          path: /tmp/e2e-proof/proof-evidence
          if-no-files-found: warn

  recovery-proof:
    name: P5 • recovery scenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [test-failure, integration-failure, verification-failure]
    env:
      E2E_AGENT_TIMEOUT: '1200'
    steps:
      - name: Checkout E2E
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install E2E
        run: python -m pip install -e . pytest

      - name: Prepare Claude Code runtime
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            Do not modify repository files. Verify the Claude Code runtime is
            available for this E2E recovery proof job, then respond READY.

      - name: Create recovery fixture
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          rm -rf /tmp/e2e-recovery
          git clone --no-local "$GITHUB_WORKSPACE" /tmp/e2e-recovery
          cd /tmp/e2e-recovery
          mkdir -p recovery_fixture
          cat > recovery_fixture/calculator.py <<'PY'
          def add(a, b):
              return a - b
          PY
          cat > recovery_fixture/test_calculator.py <<'PY'
          from calculator import add
          def test_add():
              assert add(2, 3) == 5
          PY
          case "$SCENARIO" in
            test-failure) echo 'Scenario: a test failure must be diagnosed and repaired without weakening the assertion.' > recovery_fixture/SCENARIO.md ;;
            integration-failure) echo 'Scenario: an integration mismatch must be diagnosed and repaired while preserving the contract.' > recovery_fixture/SCENARIO.md ;;
            verification-failure) echo 'Scenario: verification must catch the defect before approval, then the defect must be repaired and re-verified.' > recovery_fixture/SCENARIO.md ;;
          esac

      - name: Prove failure is detected before repair
        working-directory: /tmp/e2e-recovery
        run: |
          set +e
          python -m pytest recovery_fixture -q > pre-recovery.txt 2>&1
          code=$?
          set -e
          test "$code" -ne 0

      - name: Run SD1 diagnosis, repair and SD3 recovery verification
        working-directory: /tmp/e2e-recovery
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python -m e2e execute "Recover from the intentional $SCENARIO failure in recovery_fixture. First inspect and diagnose the failure, repair the root cause without weakening/deleting the test, run the complete fixture tests, and have SD3 independently verify that the failure was genuinely detected, repaired, and re-verified. Do not change the E2E harness." --runtime claude-code --execute --max-workers 2 | tee "recovery-${SCENARIO}.json"
          python -m pytest recovery_fixture -q
          grep -q 'assert add(2, 3) == 5' recovery_fixture/test_calculator.py
          grep -q 'return a + b' recovery_fixture/calculator.py

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-recovery-${{ matrix.scenario }}
          path: |
            /tmp/e2e-recovery/recovery-${{ matrix.scenario }}.json
            /tmp/e2e-recovery/pre-recovery.txt
            /tmp/e2e-recovery/.e2e
            /tmp/e2e-recovery/recovery_fixture
          if-no-files-found: warn
