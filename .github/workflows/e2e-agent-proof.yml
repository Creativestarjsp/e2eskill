name: E2E Real Agent Proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/e2e-agent-proof.yml
      - e2e/**
      - skills/**
      - standards/**
      - architecture/**
      - evals/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: P0-P2 proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install E2E
        run: python -m pip install -e . pytest
      - name: P0 tests
        run: pytest -q
      - name: P1 deterministic proof
        run: python -m e2e eval-suite run evals/proof.json
      - name: P2 orchestration proof
        run: |
          set -euo pipefail
          python -m e2e orchestrate 'Implement an API backend behavior change' > /tmp/plan.json
          python - <<'PY'
import json
plan = json.load(open('/tmp/plan.json'))
assert plan.get('workers'), plan
PY
